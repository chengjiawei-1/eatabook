server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:backend/.env[.properties]

  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      chat:
        completions-path: ${SILICONFLOW_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${AI_CHAT_DEFAULT_MODEL:}
      image:
        options:
          model: ${AI_IMAGE_MODEL:}

  # ==============================
  # RabbitMQ
  # ==============================
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: auto

  # ==============================
  # MySQL
  # ==============================
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lyfw?serverTimezone=GMT%2B8&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==============================
  # Redis
  # ==============================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # ==============================
  # 文件上传
  # ==============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ==============================
  # JSON
  # ==============================
  jackson:
    default-property-inclusion: always
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# ==============================
# MyBatis
# ==============================
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI gateway
# ==============================
ai:
  gateway:
    scenes:
      ancient-text-translation:
        template: classpath:/ai/prompts/ancient-text-translation.st
        provider: siliconflow
        model: ${AI_ANCIENT_TRANSLATION_MODEL:deepseek-ai/DeepSeek-V3}
        output: text
        temperature: ${AI_ANCIENT_TRANSLATION_TEMPERATURE:0.2}
        top-p: ${AI_ANCIENT_TRANSLATION_TOP_P:0.8}
        max-tokens: ${AI_ANCIENT_TRANSLATION_MAX_TOKENS:2048}
      constitution-analysis:
        template: classpath:/ai/prompts/constitution-analysis.st
      diet-therapy-plan:
        template: classpath:/ai/prompts/diet-therapy-plan.st
      constitution-change-analysis:
        template: classpath:/ai/prompts/constitution-change-analysis.st
        provider: siliconflow
        model: ${AI_CONSTITUTION_CHANGE_MODEL:deepseek-ai/DeepSeek-V3}
        output: text
        temperature: ${AI_CONSTITUTION_CHANGE_TEMPERATURE:0.2}
        top-p: ${AI_CONSTITUTION_CHANGE_TOP_P:0.8}
        max-tokens: ${AI_CONSTITUTION_CHANGE_MAX_TOKENS:2048}
      diet-therapy-qa:
        template: classpath:/ai/prompts/diet-therapy-qa.st
      culinary-image-storyboard:
        template: classpath:/ai/prompts/culinary-image-storyboard.st
        provider: siliconflow
        model: ${AI_CULINARY_STORYBOARD_MODEL:deepseek-ai/DeepSeek-V3}
        output: text
        temperature: ${AI_CULINARY_STORYBOARD_TEMPERATURE:0.2}
        top-p: ${AI_CULINARY_STORYBOARD_TOP_P:0.8}
        max-tokens: ${AI_CULINARY_STORYBOARD_MAX_TOKENS:2048}
      culinary-step-image:
        template: classpath:/ai/prompts/culinary-step-image.st
        provider: volcengine-ark
        model: ${ARK_IMAGE_MODEL:doubao-seedream-4-5-251128}
        output: image
    image:
      api-key: ${ARK_API_KEY:}
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      model: ${ARK_IMAGE_MODEL:doubao-seedream-4-5-251128}
      count: ${AI_IMAGE_COUNT:1}
      max-images: ${AI_IMAGE_MAX_IMAGES:4}
      size: ${AI_IMAGE_SIZE:2K}
      response-format: ${AI_IMAGE_RESPONSE_FORMAT:url}
      stream: ${AI_IMAGE_STREAM:true}
      watermark: ${AI_IMAGE_WATERMARK:true}
      sequential-image-generation: ${AI_IMAGE_SEQUENTIAL_GENERATION:auto}
      step-delay-millis: ${AI_IMAGE_STEP_DELAY_MILLIS:1000}
    audio:
      enabled: ${AI_AUDIO_ENABLED:false}
      model: ${AI_AUDIO_MODEL:}
      voice: ${AI_AUDIO_VOICE:}

# ==============================
# 文件上传访问路径
# ==============================
file:
  base-url: ${FILE_BASE_URL:http://localhost:8081}
  upload-dir: ${FILE_UPLOAD_DIR:${user.dir}/uploads/}

# ==============================
# Neo4j
# ==============================
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:12345678}
