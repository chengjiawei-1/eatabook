server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:backend/.env[.properties]

  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      chat:
        api-key: ${SILICONFLOW_API_KEY:}
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        completions-path: ${SILICONFLOW_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${AI_CHAT_DEFAULT_MODEL:Qwen/Qwen3-14B}
      embedding:
        api-key: ${AI_EMBEDDING_API_KEY:${SILICONFLOW_API_KEY:}}
        base-url: ${AI_EMBEDDING_BASE_URL:${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}}
        embeddings-path: ${AI_EMBEDDING_PATH:/embeddings}
        options:
          model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}
      image:
        options:
          model: ${AI_IMAGE_MODEL:}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        collection-name: ${CHROMA_COLLECTION_NAME:health_knowledge}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:true}

  # ==============================
  # RabbitMQ
  # ==============================
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}

  # ==============================
  # MySQL
  # ==============================
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lyfw?serverTimezone=GMT%2B8&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==============================
  # Redis
  # ==============================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # ==============================
  # 文件上传
  # ==============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ==============================
  # JSON
  # ==============================
  jackson:
    default-property-inclusion: always
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    org.springframework.ai.chat.model.MessageAggregator: off

app:
  ai:
    request:
      max-concurrent: ${AI_REQUEST_MAX_CONCURRENT:1}
      min-interval-millis: ${AI_REQUEST_MIN_INTERVAL_MILLIS:3000}
      max-retries: ${AI_REQUEST_MAX_RETRIES:2}
      initial-backoff-millis: ${AI_REQUEST_INITIAL_BACKOFF_MILLIS:8000}
      max-backoff-millis: ${AI_REQUEST_MAX_BACKOFF_MILLIS:30000}
  rag:
    knowledge-location: ${RAG_KNOWLEDGE_LOCATION:classpath*:knowledge/**/*}
    index-on-startup: ${RAG_INDEX_ON_STARTUP:false}
    fail-on-index-error: ${RAG_FAIL_ON_INDEX_ERROR:false}
    clear-before-index: ${RAG_CLEAR_BEFORE_INDEX:false}
    knowledge-base-id: ${RAG_KNOWLEDGE_BASE_ID:default}
    index-batch-size: ${RAG_INDEX_BATCH_SIZE:25}
    chunk:
      default-chunk-size: ${RAG_CHUNK_SIZE:500}
      min-chunk-size-chars: ${RAG_MIN_CHUNK_SIZE_CHARS:100}
      max-chunk-size-chars: ${RAG_MAX_CHUNK_SIZE_CHARS:1200}
      min-chunk-length-to-embed: ${RAG_MIN_CHUNK_LENGTH_TO_EMBED:5}
      max-num-chunks: ${RAG_MAX_NUM_CHUNKS:10000}
      keep-separator: ${RAG_KEEP_SEPARATOR:true}
    search:
      default-top-k: ${RAG_SEARCH_TOP_K:5}
      default-similarity-threshold: ${RAG_SEARCH_SIMILARITY_THRESHOLD:0.0}
  constitution-advice:
    model: ${CONSTITUTION_ADVICE_MODEL:Qwen/Qwen3-14B}
    rag-top-k: ${CONSTITUTION_ADVICE_RAG_TOP_K:8}
  diet-therapy-plan:
    extraction-model: ${DIET_PLAN_EXTRACTION_MODEL:${DEEPSEEK_CHAT_MODEL:deepseek-chat}}
    plan-model: ${DIET_PLAN_MODEL:${DEEPSEEK_CHAT_MODEL:deepseek-chat}}
  laoji:
    rag-top-k: ${LAOJI_RAG_TOP_K:5}
    max-context-chars: ${LAOJI_MAX_CONTEXT_CHARS:6000}
    rag-query-expansion-enabled: ${LAOJI_RAG_QUERY_EXPANSION_ENABLED:false}
    intent-model: ${LAOJI_INTENT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
    tools:
      intent-classifier-enabled: ${LAOJI_INTENT_CLASSIFIER_ENABLED:false}
      max-json-chars: ${LAOJI_TOOLS_MAX_JSON_CHARS:12000}

# ==============================
# MyBatis
# ==============================
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI gateway
# ==============================
ai:
  gateway:
    scenes:
      ancient-text-translation:
        template: classpath:/ai/prompts/ancient-text-translation.st
        provider: siliconflow
        model: ${AI_ANCIENT_TRANSLATION_MODEL:Qwen/Qwen3-14B}
        output: text
        temperature: ${AI_ANCIENT_TRANSLATION_TEMPERATURE:0.2}
        top-p: ${AI_ANCIENT_TRANSLATION_TOP_P:0.8}
        max-tokens: ${AI_ANCIENT_TRANSLATION_MAX_TOKENS:2048}
      constitution-analysis:
        template: classpath:/ai/prompts/constitution-analysis.st
        provider: siliconflow
        model: ${AI_CONSTITUTION_ANALYSIS_MODEL:Qwen/Qwen3-8B}
        output: text
        temperature: ${AI_CONSTITUTION_ANALYSIS_TEMPERATURE:0.1}
        top-p: ${AI_CONSTITUTION_ANALYSIS_TOP_P:0.8}
        max-tokens: ${AI_CONSTITUTION_ANALYSIS_MAX_TOKENS:1200}
      diet-therapy-plan:
        template: classpath:/ai/prompts/diet-therapy-plan.st
        provider: deepseek
        model: ${AI_DIET_THERAPY_PLAN_MODEL:${DEEPSEEK_CHAT_MODEL:deepseek-chat}}
        output: text
        temperature: ${AI_DIET_THERAPY_PLAN_TEMPERATURE:0.2}
        top-p: ${AI_DIET_THERAPY_PLAN_TOP_P:0.8}
        max-tokens: ${AI_DIET_THERAPY_PLAN_MAX_TOKENS:2048}
      constitution-change-analysis:
        template: classpath:/ai/prompts/constitution-change-analysis.st
        provider: siliconflow
        model: ${AI_CONSTITUTION_CHANGE_MODEL:Qwen/Qwen3-14B}
        output: text
        temperature: ${AI_CONSTITUTION_CHANGE_TEMPERATURE:0.2}
        top-p: ${AI_CONSTITUTION_CHANGE_TOP_P:0.8}
        max-tokens: ${AI_CONSTITUTION_CHANGE_MAX_TOKENS:2048}
      diet-therapy-qa:
        template: classpath:/ai/prompts/diet-therapy-qa.st
        provider: deepseek
        model: ${AI_LAOJI_CHAT_MODEL:${DEEPSEEK_CHAT_MODEL:deepseek-chat}}
        output: text
        temperature: ${AI_LAOJI_CHAT_TEMPERATURE:0.7}
        top-p: ${AI_LAOJI_CHAT_TOP_P:0.8}
        max-tokens: ${AI_LAOJI_CHAT_MAX_TOKENS:1200}
      culinary-image-storyboard:
        template: classpath:/ai/prompts/culinary-image-storyboard.st
        provider: siliconflow
        model: ${AI_CULINARY_STORYBOARD_MODEL:Qwen/Qwen3-14B}
        output: text
        temperature: ${AI_CULINARY_STORYBOARD_TEMPERATURE:0.2}
        top-p: ${AI_CULINARY_STORYBOARD_TOP_P:0.8}
        max-tokens: ${AI_CULINARY_STORYBOARD_MAX_TOKENS:2048}
      culinary-step-image:
        template: classpath:/ai/prompts/culinary-step-image.st
        provider: volcengine-ark
        model: ${ARK_IMAGE_MODEL:doubao-seedream-4-5-251128}
        output: image
    providers:
      siliconflow:
        api-key: ${SILICONFLOW_API_KEY:}
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        completions-path: ${SILICONFLOW_CHAT_COMPLETIONS_PATH:/chat/completions}
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        completions-path: ${DEEPSEEK_CHAT_COMPLETIONS_PATH:/chat/completions}
    image:
      api-key: ${ARK_API_KEY:}
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      model: ${ARK_IMAGE_MODEL:doubao-seedream-4-5-251128}
      count: ${AI_IMAGE_COUNT:1}
      max-images: ${AI_IMAGE_MAX_IMAGES:4}
      size: ${AI_IMAGE_SIZE:2K}
      response-format: ${AI_IMAGE_RESPONSE_FORMAT:url}
      stream: ${AI_IMAGE_STREAM:true}
      watermark: ${AI_IMAGE_WATERMARK:true}
      sequential-image-generation: ${AI_IMAGE_SEQUENTIAL_GENERATION:auto}
      step-delay-millis: ${AI_IMAGE_STEP_DELAY_MILLIS:1000}
    audio:
      enabled: ${AI_AUDIO_ENABLED:false}
      model: ${AI_AUDIO_MODEL:}
      voice: ${AI_AUDIO_VOICE:}

# ==============================
# 文件上传访问路径
# ==============================
file:
  base-url: ${FILE_BASE_URL:http://localhost:8081}
  upload-dir: ${FILE_UPLOAD_DIR:${user.dir}/uploads/}

# ==============================
# Neo4j
# ==============================
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:12345678}
