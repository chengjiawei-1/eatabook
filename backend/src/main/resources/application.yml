server:
  port: ${SERVER_PORT:8081}

spring:
  ai:
    openai:
      api-key: ${DOUBAO_API_KEY:}
      base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      image:
        options:
          model: ${DOUBAO_IMAGE_MODEL:}

  # ==============================
  # RabbitMQ
  # ==============================
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: auto

  # ==============================
  # MySQL
  # ==============================
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lyfw?serverTimezone=GMT%2B8&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==============================
  # Redis
  # ==============================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # ==============================
  # 文件上传
  # ==============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ==============================
  # JSON
  # ==============================
  jackson:
    default-property-inclusion: always
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# ==============================
# MyBatis
# ==============================
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# Dify
# ==============================
dify:
  base-url: ${DIFY_BASE_URL:https://api.dify.ai/v1}
  agents:
    translator:
      api-key: ${DIFY_TRANSLATOR_API_KEY:}
      prefix: "请将以下的【古籍原文】改写为一段自然流利的长文本:"
    suggester:
      api-key: ${DIFY_SUGGESTER_API_KEY:}
      prefix: "以下是用户的体质信息，请给出回复建议"
    projecter:
      api-key: ${DIFY_PROJECTER_API_KEY:}
      prefix: "以下是用户信息，帮我给出七日食谱计划"
    changeanalysis:
      api-key: ${DIFY_CHANGEANALYSIS_API_KEY:}
      prefix: "你帮我根据本周期的体质转换分数据，给出相应的分析建议"
    laoji:
      api-key: ${DIFY_LAOJI_API_KEY:}
      prefix: "老己啊，" # 给智能体的全局前缀，强化角色感知

# ==============================
# 文件上传访问路径
# ==============================
file:
  base-url: ${FILE_BASE_URL:http://localhost:8081}
  upload-dir: ${FILE_UPLOAD_DIR:./uploads/}

# ==============================
# Neo4j
# ==============================
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:12345678}
